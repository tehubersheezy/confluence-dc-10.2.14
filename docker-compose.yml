name: confluence-dc

services:
  confluence:
    image: atlassian/confluence:10.2.14
    container_name: confluence
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8095:8090"   # host 8090 is Jira
    environment:
      # Pre-seeds confluence.cfg.xml so the setup wizard skips the database step
      ATL_JDBC_URL: jdbc:postgresql://db:5432/confluence
      ATL_JDBC_USER: confluence
      ATL_JDBC_PASSWORD: ${CONFLUENCE_DB_PASSWORD:?set in .env}
      ATL_DB_TYPE: postgresql
      # 3-hour Data Center timebomb license from developer.atlassian.com
      ATL_LICENSE_KEY: ${CONFLUENCE_LICENSE:?set in .env}
      JVM_MINIMUM_MEMORY: 1024m
      JVM_MAXIMUM_MEMORY: 1536m
      TZ: America/New_York
    volumes:
      - confluence-home:/var/atlassian/application-data/confluence
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: confluence-db
    environment:
      POSTGRES_DB: confluence
      POSTGRES_USER: confluence
      POSTGRES_PASSWORD: ${CONFLUENCE_DB_PASSWORD:?set in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - confluence-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confluence -d confluence"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  confluence-home:
  confluence-db:
